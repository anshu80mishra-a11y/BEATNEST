<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEATNEST — your music, offline-ready</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1FA;--surface:#FFFFFF;--surface2:#E9E6F7;--ink:#15132B;--muted:#5F5C84;--line:#DAD6EE;
  --accent:#3560F0;--accent-ink:#FFFFFF;--shadow:0 10px 30px rgba(21,19,43,.14);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F0D1F;--surface:#1A1733;--surface2:#262247;--ink:#F1EFFF;--muted:#A19DCB;--line:#2E2A55;--shadow:0 10px 30px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#0F0D1F;--surface:#1A1733;--surface2:#262247;--ink:#F1EFFF;--muted:#A19DCB;--line:#2E2A55;--shadow:0 10px 30px rgba(0,0,0,.45)}
:root[data-accent="green"]{--accent:#0B8F61}
:root[data-accent="violet"]{--accent:#7A3DF0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
small{color:var(--muted)}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
svg.i.f{fill:currentColor}

#app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;padding:18px 18px 200px;-webkit-overflow-scrolling:touch}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand .mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand h1{font-size:24px;font-weight:800}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:19px;font-weight:600}
.link{color:var(--accent);font-weight:700;padding:6px 4px}

/* the one bold element: the record */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px 0 4px}
.hero h2{font-size:clamp(28px,8vw,38px);font-weight:800;line-height:1.05;max-width:14ch}
.hero p{margin:0;color:var(--muted);max-width:34ch}
.disc{position:relative;width:min(66vw,250px);aspect-ratio:1;border-radius:50%;margin:6px auto;display:grid;place-items:center;
  background:repeating-radial-gradient(circle at 50% 50%,#1d1a38 0 2px,#0f0d20 2px 5px);box-shadow:var(--shadow)}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#fff0 0 38%,#ffffff26 48%,#fff0 58% 88%,#ffffff1c 98%,#fff0)}
.disc::after{content:"";position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:var(--bg)}
.disc .lbl{width:38%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 clamp(22px,7vw,32px) var(--display)}
body.playing .disc{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:#C8372D;color:#fff}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.vip{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 0;padding:14px 16px;border-radius:20px;text-align:left;color:#fff;background:var(--accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000))}
.vip small{color:#ffffffd9}
.vip .link{color:#fff;font-weight:800}
.crown{width:40px;height:40px;border-radius:12px;background:#ffffff2e;display:grid;place-items:center;flex:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.row{display:flex;align-items:center;gap:4px;border-radius:16px}
.row.on{background:var(--surface2)}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;text-align:left;border-radius:16px}
.cov{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font:800 20px var(--display)}
.meta{display:flex;flex-direction:column;min-width:0;flex:1}
.meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.meta small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.ib[aria-pressed="true"]{color:var(--accent)}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;margin-right:4px}
.eq i{width:3px;background:var(--accent);height:100%;animation:eq .9s ease-in-out infinite;transform-origin:bottom}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.empty{text-align:center;padding:30px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font:600 18px var(--display)}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.card{width:128px;flex:none;text-align:left}
.card .cov{width:128px;height:128px;border-radius:20px;font-size:40px;margin-bottom:8px}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:48px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;min-height:46px}
.search input:focus-visible{outline:none}
.search:focus-within{outline:3px solid var(--accent)}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:999px;margin:4px 0 14px}
.seg button{flex:1;min-height:40px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}

.panelrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface2);font-weight:500}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.stat{background:var(--surface);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font:800 26px var(--display)}

#mini{position:absolute;left:10px;right:10px;bottom:72px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
#mini .inner{display:flex;align-items:center;gap:4px;padding:6px 6px 8px 6px}
#mini .rowmain{padding:4px 6px}
#mini .cov{width:42px;height:42px;border-radius:12px;font-size:17px}
#mini .bar{height:3px;background:var(--surface2)}
#mini .bar i{display:block;height:100%;width:0;background:var(--accent)}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}

#np{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:14px 22px 30px;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
#np.open{transform:none;visibility:visible;transition:transform .28s ease}
.nptop{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.npmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 6px}
.npmeta h2{font-size:26px;font-weight:800;line-height:1.1}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.ctrls .play{width:68px;height:68px}
.ctrls .play svg{width:30px;height:30px}
.ctrls .ib[aria-pressed="true"]{color:var(--accent)}
.volrow{display:flex;align-items:center;gap:10px;color:var(--muted)}

#sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,8,25,.55)}
.panel{position:relative;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px 28px;max-height:82%;overflow-y:auto}
.panel h3{font-size:20px;font-weight:800;margin-bottom:10px}
.panel p{margin:6px 0 14px;color:var(--muted)}
.field{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;margin-bottom:12px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 4px;text-align:left;border-bottom:1px solid var(--line)}
#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:90%;text-align:center}
#ytbox{position:absolute;z-index:25;display:none;overflow:hidden;background:#000;box-shadow:var(--shadow);right:10px;bottom:140px;width:200px;height:113px;border-radius:14px}
#ytbox iframe{width:100%;height:100%;border:0;display:block}
body.ytdock #ytbox{display:block}
body.ytnp #ytbox{display:block;left:22px;right:22px;top:72px;bottom:auto;width:auto;height:220px;border-radius:18px}
body.ytnp #np{overflow-y:hidden}
@media (prefers-reduced-motion:reduce){body.playing .disc,.eq i{animation:none}#np,#np.open{transition:none}}
</style>
</head>
<body>
<div id="app">
  <main id="main">
    <section id="v-home"></section>
    <section id="v-search" hidden>
      <div class="brand"><h1>Search</h1></div>

  <div id="sheet" hidden></div>

</div>

/* ---------- demo synth: tiny browser-made songs so the app is never empty ---------- */
function synth(d){
  const sr=22050,secs=28,n=sr*secs,pcm=new Int16Array(n),beat=60/d.bpm,sc=d.scale,TAU=Math.PI*2;
  const osc=(ph,w)=>{const p=ph-Math.floor(ph);return w==="saw"?2*p-1:w==="square"?(p<.5?.5:-.5):Math.sin(TAU*p)};
  for(let i=0;i<n;i++){
    const t=i/sr,bt=t/beat,b=Math.floor(bt),f=bt-b,e8=Math.floor(bt*2),ef=bt*2-e8;

const today=()=>new Date().toISOString().slice(0,10);
let cloudVip=0;

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

}
function memRow(){
  const v=isVip();

async function activate(code){
  try{
    const h=await sha("beatnest:"+code);

async function urlFor(t){
  if(t.jm)return t.url;
  if(t.demo){return demoUrl[t.id]||(demoUrl[t.id]=URL.createObjectURL(synth(t.demo)))}
  if(userUrl)URL.revokeObjectURL(userUrl);
  userUrl=URL.createObjectURL(t.blob);return userUrl;
}
function listFor(ctx){
  if(ctx==="fav")return favs.filter(byId);
  if(ctx==="recent")return recents.filter(byId);
  if(ctx.startsWith("pl:")){const l=lists.find(x=>x.id===ctx.slice(3));return l?l.ids.filter(byId):[]}
  if(ctx==="yt")return ytState.ids.filter(byId);
  if(ctx==="jm")return jmState.ids.filter(byId);
  if(ctx==="search")return searchHits().map(t=>t.id);
  return all().map(t=>t.id);
}
async function playTrack(id,ctx){
  const t=byId(id);if(!t)return;
  if(!t.demo&&!t.yt&&!t.jm&&!isVip()&&freeLeft()<=0){vipSheet(true);return}
  if(ctx&&ctx!=="queue")queue=listFor(ctx);
  if(!queue.includes(id))queue=[id];
  cur=t;
  try{
    if(t.yt){A.pause();A.removeAttribute("src");saveYT(t.id);setNP(true);await loadYT(t.yt)}
    else{if(ytp&&ytReady){try{ytp.pauseVideo()}catch(e){}}A.src=await urlFor(t);await A.play();if(t.jm)saveYT(t.id);syncYT()}
  }
  catch(e){toast("This file won't play. Try another MP3.");render();return}
  recents=[id].concat(recents.filter(x=>x!==id)).slice(0,20);store.set("recents",recents);
  played++;store.set("played",played);
  track("play_track",{source:t.yt?"youtube":t.jm?"jamendo":t.demo?"starter":"local"});
  if(!t.demo&&!t.yt&&!t.jm&&!isVip()){dayPlays={d:today(),n:(dayPlays.d===today()?dayPlays.n:0)+1};store.set("day",dayPlays)}
  meta();render();
}
function step(dir,auto){
  if(!cur)return;
  const i=queue.indexOf(cur.id);
  if(auto&&repeat===2){seekTo(0);doPlay();return}
  if(shuffle&&queue.length>1){let n;do{n=queue[Math.floor(Math.random()*queue.length)]}while(n===cur.id);return playTrack(n)}
  if(dir<0){if(curTime()>3){seekTo(0);return}return playTrack(queue[(i-1+queue.length)%queue.length])}
  const n=i+1;
  if(n>=queue.length){if(repeat===1||!auto)return playTrack(queue[0]);doPause();seekTo(0);return}
  playTrack(queue[n]);
}
const toggle=()=>{if(!cur){const f=all()[0];return f&&playTrack(f.id,"lib")}isPaused()?doPlay():doPause()};

/* ---------- YouTube ---------- */
let ytp=null,ytReady=false,ytPending=null,ytPaused=true;
const isPaused=()=>cur&&cur.yt?ytPaused:A.paused;
const dec=x=>{const e=document.createElement("textarea");e.innerHTML=x;return e.value};
function saveYT(id){const t=ytMap[id];if(t){ytSaved[id]=t;store.set("yts",ytSaved)}}
function syncYT(){const o=$("#np").classList.contains("open"),y=!!(cur&&cur.yt);document.body.classList.toggle("ytnp",y&&o);document.body.classList.toggle("ytdock",y&&!o)}
function setNP(o){$("#np").classList.toggle("open",o);syncYT()}
function ytInit(){
  if(window.YT&&YT.Player)return ytCreate();
  if(document.getElementById("ytapi"))return;
  window.onYouTubeIframeAPIReady=ytCreate;
  const sc=document.createElement("script");sc.id="ytapi";sc.src="https://www.youtube.com/iframe_api";
  sc.onerror=()=>toast("YouTube couldn't load. Check your internet.");
  document.head.appendChild(sc);
}
function ytCreate(){
  ytp=new YT.Player("ytplayer",{width:"100%",height:"100%",playerVars:{playsinline:1,rel:0},events:{
    onReady:()=>{ytReady=true;try{ytp.setVolume(vol*100)}catch(e){}if(ytPending){const v=ytPending;ytPending=null;ytp.loadVideoById(v)}},
    onStateChange:onYT,
    onError:()=>{ytPaused=true;toast("This video can't be played here. Try another one.");render()}
  }});
}
function loadYT(id){ytPaused=false;if(ytp&&ytReady){ytp.loadVideoById(id);try{ytp.setVolume(vol*100)}catch(e){}}else{ytPending=id;ytInit()}return Promise.resolve()}
function onYT(e){
  if(!cur||!cur.yt)return;
  const st=e.data;
  if(st===1)ytPaused=false;else if(st===2||st===0||st===5)ytPaused=true;
  if(st===0)step(1,true);else render();
}
function curTime(){return cur&&cur.yt?(ytp&&ytReady&&ytp.getCurrentTime?ytp.getCurrentTime():0):A.currentTime}
function curDur(){return cur&&cur.yt?(ytp&&ytReady&&ytp.getDuration?ytp.getDuration():0):A.duration}
function seekTo(x){if(cur&&cur.yt){if(ytp&&ytReady)ytp.seekTo(x,true)}else A.currentTime=x}
function doPlay(){if(cur&&cur.yt){try{ytp.playVideo()}catch(e){}}else A.play()}
function doPause(){if(cur&&cur.yt){try{ytp.pauseVideo()}catch(e){}}else A.pause()}
setInterval(()=>{if(cur&&cur.yt&&!ytPaused)tick()},500);
async function ytSearch(){
  const q=($("#q").value||"").trim();
  if(!q||!CFG.ytKey)return;
  if(ytCache[q]){ytState={q,ids:ytCache[q],loading:false};renderSearch();return}
  ytState={q,ids:[],loading:true};renderSearch();track("youtube_search");
  try{
    const u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=15&q="+encodeURIComponent(q)+"&key="+encodeURIComponent(CFG.ytKey);
    const r=await fetch(u),j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||"Search failed");
    const ids=[];
    (j.items||[]).forEach(it=>{if(!it.id||!it.id.videoId)return;const t={id:"yt-"+it.id.videoId,yt:it.id.videoId,title:dec(it.snippet.title),artist:dec(it.snippet.channelTitle)};ytMap[t.id]=t;ids.push(t.id)});
    ytCache[q]=ids;ytState={q,ids,loading:false};
  }catch(e){
    const m=String(e.message||e);
    ytState={q,ids:[],loading:false,err:/quota/i.test(m)?"YouTube's daily search limit is used up. Try again tomorrow.":/referer|referrer|not valid|key/i.test(m)?"The YouTube key was rejected (key ends "+CFG.ytKey.slice(-4)+"): "+m:/fetch|network/i.test(m)?"Couldn't reach YouTube. Check your internet.":m};
  }
  renderSearch();
}
function ytBlock(q){
  if(!CFG.ytKey)return"";
  const st=ytState,b=`<div class="sec"><h2>On YouTube</h2></div>`;
  if(st.q!==q)return b+`<button class="btn primary" data-act="ytsearch">Search YouTube for “${esc(q)}”</button>`;
  if(st.loading)return b+`<div class="empty"><b>Searching YouTube</b></div>`;
  if(st.err)return b+`<div class="empty"><b>YouTube search didn't work</b>${esc(st.err)}<button class="btn ghost" data-act="ytsearch">Try again</button></div>`;
  return b+(st.ids.length?rows(st.ids,"yt"):`<div class="empty"><b>No videos found</b>Try a different spelling or the artist name.</div>`);
}

/* ---------- Firebase: Google sign-in, cloud sync, VIP from account, analytics ---------- */
let fb=null,fbUser=null,fbUnsub=null,syncT=null,firstSnap=true;
function cloudKey(k){return["favs","lists","recents","played","yts"].includes(k)}
function track(n,p){try{if(fb&&fb.an)fb.logEvent(fb.an,n,p||{})}catch(e){}}
async function fbInit(){
  if(!CFG.firebase||fb)return;
  try{
    const base="https://www.gstatic.com/firebasejs/10.12.2/";
    const [app,au,fs,anm]=await Promise.all([
      import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js"),
      import(base+"firebase-analytics.js").catch(()=>null)
    ]);
    const a=app.initializeApp(CFG.firebase);
    const m={app:a,au,fs,auth:au.getAuth(a),db:fs.getFirestore(a),an:null,logEvent:anm?anm.logEvent:null};
    try{if(anm&&await anm.isSupported())m.an=anm.getAnalytics(a)}catch(e){}
    fb=m;
    au.onAuthStateChanged(m.auth,u=>{
      fbUser=u;firstSnap=true;cloudVip=0;
      if(fbUnsub){fbUnsub();fbUnsub=null}
      if(u)watchCloud();
      render();
    });
    render();
  }catch(e){fb=null}
}
function watchCloud(){
  const ref=fb.fs.doc(fb.db,"users",fbUser.uid);
  fbUnsub=fb.fs.onSnapshot(ref,snap=>{
    const d=snap.exists()?snap.data():null,v=d&&d.vipUntil;
    cloudVip=v?(v.toMillis?v.toMillis():Number(v)||0):0;
    if(firstSnap){firstSnap=false;mergeCloud(d)}
    render();
  },()=>toast("Couldn't sync with your account."));
}
function mergeCloud(d){
  if(d){
    favs=[...new Set([...(d.favs||[]),...favs])];
    (d.lists||[]).forEach(cl=>{const l=lists.find(x=>x.id===cl.id);if(l)l.ids=[...new Set([...(cl.ids||[]),...l.ids])];else lists.push({id:cl.id,name:cl.name,ids:cl.ids||[]})});
    recents=[...new Set([...recents,...(d.recents||[])])].slice(0,20);
    played=Math.max(played,d.played||0);
    Object.assign(ytSaved,d.yts||{});ytMap=Object.assign({},ytSaved,ytMap);
    store.set("yts",ytSaved);store.set("favs",favs);store.set("lists",lists);store.set("recents",recents);store.set("played",played);
  }
  cloudSched();
}
function cloudSched(){if(!fb||!fbUser)return;clearTimeout(syncT);syncT=setTimeout(cloudPush,1200)}
async function cloudPush(){
  if(!fb||!fbUser)return;
  const need=new Set([...favs,...recents,...lists.flatMap(l=>l.ids)]),yts={};
  need.forEach(id=>{if(ytMap[id])yts[id]=ytMap[id]});
  try{
    await fb.fs.setDoc(fb.fs.doc(fb.db,"users",fbUser.uid),{favs,lists,recents:recents.slice(0,20),played,yts,email:fbUser.email||"",name:fbUser.displayName||"",updatedAt:fb.fs.serverTimestamp()},{merge:true});
  }catch(e){}
}
async function fbSignIn(){
  if(!fb){toast("Sign-in isn't available right now. Check your internet.");return}
  try{
    await fb.au.signInWithPopup(fb.auth,new fb.au.GoogleAuthProvider());
    track("login",{method:"google"});toast("Signed in");
  }catch(e){
    const c=e&&e.code;
    toast(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?"Sign-in was cancelled.":c==="auth/unauthorized-domain"?"Add this site under Authorized domains in Firebase.":c==="auth/popup-blocked"?"Allow pop-ups for this site, then try again.":"Couldn't sign in. Try again.");
  }
}
async function fbSignOut(){try{await fb.au.signOut(fb.auth);toast("Signed out")}catch(e){}}
function accountRow(){
  if(!CFG.firebase)return"";
  if(fbUser)return`<div class="panelrow"><span>${esc(fbUser.displayName||"Signed in")}<br><small>${esc(fbUser.email||"")}</small></span><button class="btn ghost" data-act="signout">Sign out</button></div>`;

function accountHint(){
  if(!CFG.firebase)return"";
  return fbUser?`<p><small>Signed in as ${esc(fbUser.email||"your account")}. Use this email when you send your payment screenshot and VIP turns on for your account.</small></p>`:`<div class="btns" style="justify-content:flex-start;margin-bottom:10px"><button class="btn ghost" data-act="signin">Sign in with Google first</button></div>`;

function saveBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function jmSearch(){
  const q=($("#q").value||"").trim();
  if(!q||!CFG.jamendoId)return;
  if(jmCache[q]){jmState={q,ids:jmCache[q],loading:false};renderSearch();return}
  jmState={q,ids:[],loading:true};renderSearch();
  try{
    const u="https://api.jamendo.com/v3.0/tracks/?client_id="+encodeURIComponent(CFG.jamendoId)+"&format=json&limit=15&audioformat=mp32&search="+encodeURIComponent(q);
    const r=await fetch(u),j=await r.json();
    if(!r.ok||(j.headers&&j.headers.status==="failed"))throw new Error((j.headers&&j.headers.error_message)||"Search failed");
    const ids=[];
    (j.results||[]).forEach(it=>{if(!it.audio)return;const t={id:"jm-"+it.id,jm:true,url:it.audio,dl:(it.audiodownload_allowed&&it.audiodownload)?it.audiodownload:"",title:it.name||"Untitled",artist:it.artist_name||"Jamendo artist"};ytMap[t.id]=t;ids.push(t.id)});
    jmCache[q]=ids;jmState={q,ids,loading:false};track("jamendo_search");
  }catch(e){
    const m=String(e.message||e);
    jmState={q,ids:[],loading:false,err:/client/i.test(m)?"The Jamendo Client ID was rejected: "+m:/fetch|network/i.test(m)?"Couldn't reach Jamendo. Check your internet.":m};
  }

function jmBlock(q){

  if(st.loading)return b+`<div class="empty"><b>Searching free music</b></div>`;
  if(st.err)return b+`<div class="empty"><b>Free music search didn't work</b>${esc(st.err)}<button class="btn ghost" data-act="jmsearch">Try again</button></div>`;
  return b+(st.ids.length?rows(st.ids,"jm"):`<div class="empty"><b>No free songs found</b>Try a different spelling or the artist name.</div>`);

async function downloadTrack(id){
  const t=byId(id);
  if(!t||t.yt){toast("YouTube songs can't be downloaded.");return}
  if(t.jm){
    const nm=((t.title||"song").replace(/[\\/:*?"<>|]+/g," ").trim()||"song")+".mp3";
    if(!t.dl){toast("Downloads aren't allowed for this song.");return}
    try{const r=await fetch(t.dl);if(!r.ok)throw new Error("x");saveBlob(await r.blob(),nm);toast("Downloading "+nm)}
    catch(e){window.open(t.dl,"_blank","noopener");toast("Opening the download link")}
    track("download_song",{source:"jamendo"});return;
  }
  try{
    const blob=t.demo?synth(t.demo):t.blob;
    if(!blob){toast("This song isn't available to download.");return}
    const safe=(t.title||"song").replace(/[\\/:*?"<>|]+/g," ").trim()||"song";
    const name=t.demo?safe+".wav":(blob.name||safe+"."+((blob.type.split("/")[1]||"mp3").replace("mpeg","mp3").replace("x-m4a","m4a").replace("mp4","m4a")));
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast("Downloading "+name);track("download_song",{source:t.demo?"starter":"local"});
  }catch(e){toast("Couldn't download this song.")}
}

  if(!q)h=`<div class="empty"><b>Find a song</b>${(CFG.ytKey||CFG.jamendoId)?"Search your library, free music and YouTube. Press Enter to search online.":"Type a title or artist from your library."}</div>`;
  else{
    if(hits.length)h+=`<small>${hits.length} in your library</small>${rows(hits.map(t=>t.id),"search")}`;
    else if(!CFG.ytKey&&!CFG.jamendoId)h+=`<div class="empty"><b>No match for “${esc(q)}”</b>Check the spelling, or add the song from your phone.<button class="btn ghost" data-act="add">${ic("plus")} Add songs</button></div>`;
    h+=jmBlock(q);h+=ytBlock(q);
  }
  $("#sres").innerHTML=h;
}
function renderLib(){
  const seg=(k,l)=>`<button role="tab" data-act="seg" data-id="${k}" aria-selected="${libSeg===k}">${l}</button>`;
  let h=`<div class="brand"><h1>Library</h1></div><div class="seg" role="tablist">${seg("songs","Songs")}${seg("fav","Favorites")}${seg("lists","Playlists")}</div>`;
  if(libSeg==="songs"){
    h+=`<div class="btns" style="justify-content:flex-start;margin-bottom:8px"><button class="btn ghost" data-act="add">${ic("plus")} Add songs</button></div>`+rows(all().map(t=>t.id),"lib");
  }else if(libSeg==="fav"){
    const f=favs.filter(byId);
    h+=f.length?rows(f,"fav"):`<div class="empty"><b>No favorites yet</b>Tap the heart on any song to keep it here.</div>`;
  }else if(openList){
    const l=lists.find(x=>x.id===openList);
    if(!l){openList=null;return renderLib()}
    const ids=l.ids.filter(byId);
    h+=`<button class="link" data-act="plback">‹ All playlists</button><div class="sec" style="margin-top:6px"><h2>${esc(l.name)}</h2><button class="link" data-act="pldel" data-id="${l.id}">Delete</button></div>`;
    h+=ids.length?`<div class="btns" style="justify-content:flex-start;margin-bottom:8px"><button class="btn primary" data-act="play" data-id="${ids[0]}" data-ctx="pl:${l.id}">${ic("play")} Play all</button></div>${rows(ids,"pl:"+l.id)}`:`<div class="empty"><b>This playlist is empty</b>Open “More” on any song and choose “Add to playlist”.</div>`;
  }else{
    h+=`<div class="btns" style="justify-content:flex-start;margin-bottom:8px"><button class="btn ghost" data-act="newpl">${ic("plus")} New playlist</button></div>`;
    h+=lists.length?lists.map(l=>`<button class="lrow" data-act="plopen" data-id="${l.id}"><span class="meta"><b>${esc(l.name)}</b><small>${l.ids.filter(byId).length} songs</small></span></button>`).join(""):`<div class="empty"><b>No playlists yet</b>Group songs for the gym, travel, or late nights.</div>`;
  }
  $("#v-lib").innerHTML=h;
}
function renderMe(){
  const th=store.get("theme","auto"),ac=store.get("accent","blue");
  const o=(act,id,l,on)=>`<button class="opt" data-act="${act}" data-id="${id}" aria-pressed="${on}">${l}</button>`;
  let h=`<div class="brand"><h1>Profile</h1></div>
  <div class="stats"><div class="stat"><b>${favs.filter(byId).length}</b><small>Favorites</small></div><div class="stat"><b>${played}</b><small>Plays</small></div><div class="stat"><b>${userTracks.length}</b><small>On phone</small></div></div>
  ${accountRow()}${memRow()}
  <div class="panelrow"><span>Appearance</span><div class="opts">${o("theme","auto","Auto",th==="auto")}${o("theme","light","Light",th==="light")}${o("theme","dark","Dark",th==="dark")}</div></div>
  <div class="panelrow"><span>Accent color</span><div class="opts">${o("accent","blue","Blue",ac==="blue")}${o("accent","green","Green",ac==="green")}${o("accent","violet","Violet",ac==="violet")}</div></div>
  <div class="panelrow"><span>Sleep timer<br><small>${sleepAt?"Stops in about "+Math.max(1,Math.round((sleepAt-Date.now())/60000))+" min":"Off"}</small></span><button class="btn ghost" data-act="sleep">${ic("moon")} Set</button></div>
  <div class="panelrow"><span>Clear play history</span><button class="btn ghost" data-act="clearhist">Clear</button></div>
  <div class="panelrow"><span>Reset the app<br><small>Removes saved songs, favorites and playlists.</small></span><button class="btn ghost" data-act="reset">Reset</button></div>`;
  h+=`<p style="margin-top:22px"><small>BEATNEST v5.4 · Keys: Space play/pause, ← → seek, N next, P previous</small></p>`;
  $("#v-me").innerHTML=h;
}
function renderMini(){
  const m=$("#mini");
  if(!cur){m.hidden=true;return}
  m.hidden=false;
  m.innerHTML=`<div class="inner"><button class="rowmain" data-act="npopen" aria-label="Open player: ${esc(cur.title)}">${cov(cur)}<span class="meta"><b>${esc(cur.title)}</b><small>${esc(cur.artist)}</small></span></button><button class="play" data-act="toggle" aria-label="${isPaused()?"Play":"Pause"}">${ic(isPaused()?"play":"pause")}</button></div><div class="bar"><i id="mprog"></i></div>`;
  tick();
}
function renderNP(){
  const n=$("#np");
  if(!cur){n.innerHTML="";return}
  const fav=favs.includes(cur.id),i=queue.indexOf(cur.id),next=queue.slice(i+1,i+6);
  n.innerHTML=`<div class="nptop"><button class="ib" data-act="npclose" aria-label="Close player">${ic("down")}</button><span>Now playing</span><button class="ib" data-act="more" data-id="${cur.id}" aria-label="More options">${ic("more")}</button></div>
  ${cur.yt?`<div style="height:220px;margin:14px 0 6px"></div>`:`<div style="margin:14px 0 6px">${disc(cur)}</div>`}
  <div class="npmeta"><div><h2>${esc(cur.title)}</h2><small>${esc(cur.artist)}</small></div><button class="ib" data-act="fav" data-id="${cur.id}" aria-pressed="${fav}" aria-label="${fav?"Remove from favorites":"Add to favorites"}">${ic("heart",fav)}</button></div>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  <div class="ctrls"><button class="ib" data-act="shuffle" aria-pressed="${shuffle}" aria-label="Shuffle">${ic("shuffle")}</button><button class="ib" data-act="prev" aria-label="Previous">${ic("prev")}</button><button class="play" data-act="toggle" aria-label="${isPaused()?"Play":"Pause"}">${ic(isPaused()?"play":"pause")}</button><button class="ib" data-act="next" aria-label="Next">${ic("next")}</button><button class="ib" data-act="repeat" aria-pressed="${repeat>0}" aria-label="Repeat: ${["off","all","one"][repeat]}">${ic(repeat===2?"repeat1":"repeat")}</button></div>
  <div class="volrow">${ic("vol")}<input id="vol" type="range" min="0" max="100" value="${Math.round(vol*100)}" aria-label="Volume">${cur.yt?"":`<button class="ib" data-act="dl" data-id="${cur.id}" aria-label="Download this song">${ic("download")}</button>`}<button class="ib" data-act="sleep" aria-label="Sleep timer">${ic("moon")}</button></div>
  ${next.length&&!cur.yt?`<div class="sec"><h2>Up next</h2></div>${rows(next,"queue")}`:""}`;
  tick();
}
function tick(){
  const d=curDur(),c=curTime();
  if(!isFinite(d)||!d)return;
  const p=c/d,mp=$("#mprog");if(mp)mp.style.width=(p*100)+"%";
  const s=$("#seek");if(s&&!seeking)s.value=p*1000;
  const tc=$("#tcur"),td=$("#tdur");if(tc)tc.textContent=fmt(c);if(td)td.textContent=fmt(d);
}
function render(){
  document.body.classList.toggle("playing",!!cur&&!isPaused());syncYT();
  renderHome();renderSearch();renderLib();renderMe();renderMini();renderNP();
  ["home","search","lib","me"].forEach(k=>{$("#v-"+k).hidden=tab!==k});
  document.querySelectorAll("nav button").forEach((b,i)=>{
    const k=b.dataset.id;b.innerHTML=ic({home:"home",search:"search",lib:"lib",me:"user"}[k])+`<span>${{home:"Home",search:"Search",lib:"Library",me:"Profile"}[k]}</span>`;
    if(k===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  $("#sic").innerHTML=ic("search");
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function sheet(html){const s=$("#sheet");s.innerHTML=`<div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;const f=s.querySelector("input,button.lrow,.btn");if(f)f.focus()}
function closeSheet(){const s=$("#sheet");s.hidden=true;s.innerHTML=""}

/* ---------- actions ---------- */
function setTheme(v){store.set("theme",v);const r=document.documentElement;v==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",v)}
function setAccent(v){store.set("accent",v);const r=document.documentElement;v==="blue"?r.removeAttribute("data-accent"):r.setAttribute("data-accent",v)}
function setSleep(min){
  clearTimeout(sleepTimer);sleepAt=0;
  if(min){sleepAt=Date.now()+min*60000;sleepTimer=setTimeout(()=>{doPause();sleepAt=0;toast("Sleep timer ended");render()},min*60000);toast("Music will stop in "+min+" min")}
  else toast("Sleep timer off");
  closeSheet();renderMe();
}
function addToList(listId,songId){
  const l=lists.find(x=>x.id===listId);if(!l)return;saveYT(songId);
  if(!l.ids.includes(songId))l.ids.push(songId);
  store.set("lists",lists);toast("Added to "+l.name);closeSheet();render();
}
async function addFiles(fl){
  let n=0;
  for(const f of fl){
    if(!(f.type||"").startsWith("audio/")&&!/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name))continue;
    const t={id:"u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim()||"Untitled",artist:"On this phone",blob:f};
    userTracks.push(t);await tx("readwrite",s=>s.put(t));n++;
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  toast(n?`Added ${n} ${n===1?"song":"songs"}`:"Choose audio files like MP3 or M4A");render();
}
async function removeTrack(id){
  userTracks=userTracks.filter(t=>t.id!==id);await tx("readwrite",s=>s.delete(id));
  favs=favs.filter(x=>x!==id);recents=recents.filter(x=>x!==id);lists.forEach(l=>l.ids=l.ids.filter(x=>x!==id));
  store.set("favs",favs);store.set("recents",recents);store.set("lists",lists);
  if(cur&&cur.id===id){doPause();A.pause();A.removeAttribute("src");cur=null;setNP(false)}
  closeSheet();toast("Removed from this phone");render();
}
async function resetAll(){
  doPause();A.pause();A.removeAttribute("src");cur=null;queue=[];userTracks=[];favs=[];recents=[];lists=[];played=0;
  await tx("readwrite",s=>s.clear());store.wipe();store.set("vip",vip);store.set("used",usedCodes);store.set("day",dayPlays);setTheme("auto");setAccent("blue");
  setNP(false);closeSheet();toast("BEATNEST was reset");render();cloudSched();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case"tab":tab=id;if(id==="lib"&&libSeg!=="lists")openList=null;render();$("#main").scrollTop=0;if(id==="search")$("#q").focus();break;
    case"play":playTrack(id,b.dataset.ctx);break;
    case"toggle":toggle();break;
    case"next":step(1);break;
    case"prev":step(-1);break;
    case"shuffle":shuffle=!shuffle;store.set("shuffle",shuffle);renderNP();break;
    case"repeat":repeat=(repeat+1)%3;store.set("repeat",repeat);renderNP();break;
    case"fav":saveYT(id);favs=favs.includes(id)?favs.filter(x=>x!==id):favs.concat(id);store.set("favs",favs);render();break;
    case"npopen":if(cur){setNP(true);$("#np .ib")&&$("#np .ib").focus()}break;
    case"npclose":setNP(false);break;
    case"add":$("#files").click();break;
    case"seg":libSeg=id;openList=null;renderLib();break;
    case"plopen":openList=id;renderLib();break;
    case"plback":openList=null;renderLib();break;
    case"newpl":sheet(`<h3>New playlist</h3><input class="field" id="plname" maxlength="40" placeholder="Playlist name" aria-label="Playlist name"><div class="btns"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="plcreate" data-id="${id||""}">Create playlist</button></div>`);break;
    case"plcreate":{const n=($("#plname").value||"").trim();if(!n){toast("Give the playlist a name");return}
      const l={id:"l-"+Date.now().toString(36),name:n,ids:[]};lists.push(l);store.set("lists",lists);
      if(id)addToList(l.id,id);else{closeSheet();libSeg="lists";openList=null;render()}break}
    case"pldel":lists=lists.filter(x=>x.id!==id);store.set("lists",lists);openList=null;toast("Playlist deleted");render();break;
    case"more":{const t=byId(id);if(!t)return;
      sheet(`<h3>${esc(t.title)}</h3><p>${esc(t.artist)}</p>
      <button class="lrow" data-act="addpl" data-id="${id}">Add to playlist</button>
      <button class="lrow" data-act="playnext" data-id="${id}">Play next</button>
      ${t.yt?`<div class="lrow" style="color:var(--muted)">YouTube songs can't be downloaded</div>`:(t.jm&&!t.dl)?`<div class="lrow" style="color:var(--muted)">The artist doesn't allow downloads for this song</div>`:`<button class="lrow" data-act="dl" data-id="${id}">Download</button>`}
      ${t.demo||t.yt||t.jm?"":`<button class="lrow" data-act="rm" data-id="${id}" style="color:#C8372D">Remove from this phone</button>`}`);break}
    case"addpl":sheet(`<h3>Add to playlist</h3>${lists.map(l=>`<button class="lrow" data-act="addto" data-id="${l.id}" data-song="${id}">${esc(l.name)}</button>`).join("")}<button class="lrow" data-act="newpl" data-id="${id}">${ic("plus")} New playlist</button>`);break;
    case"addto":addToList(id,b.dataset.song);break;
    case"playnext":{if(!queue.length){playTrack(id,"lib")}else{queue=queue.filter(x=>x!==id);const i=queue.indexOf(cur&&cur.id);queue.splice(i+1,0,id);toast("Playing next");renderNP()}closeSheet();break}
    case"rm":removeTrack(id);break;
    case"sleep":sheet(`<h3>Sleep timer</h3>${[15,30,45,60].map(m=>`<button class="lrow" data-act="setsleep" data-id="${m}">Stop after ${m} minutes</button>`).join("")}<button class="lrow" data-act="setsleep" data-id="0">Turn off</button>`);break;
    case"setsleep":setSleep(+id);break;
    case"theme":setTheme(id);renderMe();break;
    case"accent":setAccent(id);renderMe();break;
    case"clearhist":recents=[];store.set("recents",recents);toast("History cleared");render();break;
    case"reset":sheet(`<h3>Reset BEATNEST?</h3><p>This removes songs saved in the app, favorites, playlists and settings. Files on your phone are not touched, and your VIP membership stays.</p><div class="btns"><button class="btn ghost" data-act="close">Keep my data</button><button class="btn danger" data-act="resetgo">Reset everything</button></div>`);break;
    case"resetgo":resetAll();break;
    case"dl":closeSheet();downloadTrack(id);break;
    case"signin":fbSignIn();break;
    case"signout":fbSignOut();break;
    case"ytsearch":ytSearch();break;
    case"jmsearch":jmSearch();break;
    case"vip":vipSheet(false);break;
    case"copyupi":try{navigator.clipboard.writeText(CFG.upiId).then(()=>toast("UPI ID copied"),()=>toast("UPI ID: "+CFG.upiId))}catch(e){toast("UPI ID: "+CFG.upiId)}break;
    case"activate":{const c=($("#vipcode").value||"").trim().toUpperCase().replace(/\s+/g,"");if(!c){toast("Enter your VIP code");return}activate(c);break}
    case"close":closeSheet();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="seek"){seeking=true;{const d=curDur();if(isFinite(d)&&d)seekTo(e.target.value/1000*d)}}
  else if(e.target.id==="vol"){vol=e.target.value/100;A.volume=vol;if(ytp&&ytReady)ytp.setVolume(vol*100);store.set("vol",vol)}
  else if(e.target.id==="q"){clearTimeout(renderSearch.t);renderSearch.t=setTimeout(renderSearch,150)}
});
document.addEventListener("change",e=>{if(e.target.id==="seek")seeking=false});
$("#files").addEventListener("change",e=>{addFiles([...e.target.files]);e.target.value=""});
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key==="Enter"&&e.target.id==="q"){e.preventDefault();ytSearch();jmSearch();return}
  if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else setNP(false);return}
  if(tag==="input"||tag==="textarea"||e.target.closest("button")&&e.key===" ")return;
  if(e.key===" "){e.preventDefault();toggle()}
  else if(e.key==="ArrowRight"&&cur)seekTo(Math.min(curDur()||0,curTime()+10));
  else if(e.key==="ArrowLeft"&&cur)seekTo(Math.max(0,curTime()-10));
  else if(e.key.toLowerCase()==="n")step(1);
  else if(e.key.toLowerCase()==="p")step(-1);
});
A.addEventListener("timeupdate",tick);
A.addEventListener("loadedmetadata",tick);
A.addEventListener("play",render);
A.addEventListener("pause",render);
A.addEventListener("ended",()=>step(1,true));
A.addEventListener("error",()=>{if(cur&&A.src)toast("This file won't play. Try another MP3.")});

/* ---------- start ---------- */
(async()=>{
  setTheme(store.get("theme","auto"));setAccent(store.get("accent","blue"));
  db=await openDB();
  const saved=await tx("readonly",s=>s.getAll());
  userTracks=Array.isArray(saved)?saved:[];
  favs=favs.filter(byId);
  render();
  fbInit();
})();
})();
</script>
</body>
</html>
