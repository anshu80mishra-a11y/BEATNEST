<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatNest Studio - Engineered by Himanshu Mishra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent: #38bdf8;
      --bg-base: #060911;
      --bg-surface: rgba(15, 23, 42, 0.7);
      --bg-surface-hover: rgba(30, 41, 59, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #0e172a 0%, var(--bg-base) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .hidden { display: none !important; }

    /* AUTH SECTION */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(13, 19, 33, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px var(--primary-glow);
      text-align: center;
    }
    .badge-chip {
      width: 48px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      margin: 0 auto 14px;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
    }
    .cyber-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #fff;
    }
    .dev-tag {
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 6px;
      font-weight: 700;
    }
    .input-field {
      width: 100%;
      padding: 13px 16px;
      margin-top: 12px;
      background: rgba(8, 13, 24, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .btn-main {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #032014;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      font-size: 0.92rem;
      transition: 0.2s;
    }
    .btn-main:hover { background: #10d393; }
    .btn-sub {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    /* DASHBOARD */
    .header-bar {
      background: rgba(8, 13, 24, 0.85);
      backdrop-filter: blur(14px);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      padding: 18px 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      overflow-x: auto;
    }
    .tab-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab-item.active {
      background: var(--primary);
      color: #032014;
      border-color: var(--primary);
    }
    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 180px;
      flex: 1;
    }

    /* SEARCH */
    .search-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-group input {
      flex: 1;
      padding: 13px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: #fff;
      outline: none;
      font-size: 0.92rem;
    }
    .search-btn-pro {
      padding: 0 26px;
      background: var(--primary);
      color: #032014;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    /* LIST */
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .song-card:hover {
      background: var(--bg-surface-hover);
      transform: translateY(-2px);
    }
    .song-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #000;
    }
    .song-meta {
      flex: 1;
      overflow: hidden;
    }
    .song-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 6px;
    }
    .fav-active { color: #f43f5e !important; }

    /* DOCK PLAYER */
    .bottom-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(8, 13, 24, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }
    .track-details {
      width: 35%;
      overflow: hidden;
    }
    .dock-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* DIRECT EMBED PLAYER FRAME (NO ERROR 153) */
    .player-frame-box {
      width: 250px;
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 18px rgba(0,0,0,0.8);
    }
    .player-frame-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
    }
    footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="auth-wrapper" id="authSection">
    <div class="auth-card">
      <div class="badge-chip"></div>
      <div class="cyber-title">BeatNest</div>
      <div class="dev-tag">DEV: HIMANSHU MISHRA</div>
      <input type="email" class="input-field" id="email" placeholder="Email Address">
      <input type="password" class="input-field" id="password" placeholder="Password">
      <button class="btn-main" id="loginBtn">Sign In</button>
      <button class="btn-main btn-sub" id="guestBtn">Guest Access (Direct Play)</button>
      <p id="authMsg" style="color:#f43f5e; font-size:0.8rem; margin-top:10px;"></p>
    </div>
  </div>

  <!-- APP INTERFACE -->
  <div class="hidden" id="appSection">
    <div class="header-bar">
      <div class="brand-logo">⚡ BeatNest</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="userBadge" style="font-size:0.85rem; font-weight:600; color:var(--primary);"></span>
        <button id="logoutBtn" style="background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3); color:#f43f5e; padding:6px 14px; border-radius:10px; cursor:pointer;">Logout</button>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-item active" id="tabSearch">Search Full Tracks</button>
      <button class="tab-item" id="tabFavorites">Favorites (<span id="favCount">0</span>)</button>
      <button class="tab-item" id="tabOffline">Offline Songs Vault (<span id="offCount">0</span>)</button>
    </div>

    <!-- SEARCH -->
    <div class="container" id="searchView">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="Search song or artist name...">
        <button class="search-btn-pro" id="searchBtn">Search</button>
      </div>
      <div class="song-list" id="searchResults"></div>
    </div>

    <!-- FAVORITES -->
    <div class="container hidden" id="favoritesView">
      <div class="song-list" id="favResults"></div>
    </div>

    <!-- OFFLINE -->
    <div class="container hidden" id="offlineView">
      <div style="border: 2px dashed rgba(255,255,255,0.15); padding: 26px; border-radius:16px; text-align:center; margin-bottom:20px;">
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:14px;">Device se bina internet gaana chalane ke liye MP3 chunein:</p>
        <input type="file" id="localFileInput" accept="audio/*" style="display:none;">
        <button class="btn-main" style="max-width:200px; margin:0 auto;" onclick="document.getElementById('localFileInput').click()">+ Select MP3</button>
      </div>
      <div class="song-list" id="offlineResults"></div>
    </div>

    <footer>
      Engineered by <strong>Himanshu Mishra</strong> | Contact: <a href="mailto:himanshu120mishra@gmail.com">himanshu120mishra@gmail.com</a>
    </footer>
  </div>

  <!-- PERSISTENT DOCK PLAYER -->
  <div class="bottom-player hidden" id="playerDock">
    <div class="track-details">
      <div class="dock-title" id="dockTitle">Song will play here</div>
      <div class="dock-sub" id="dockSub">Direct Web Audio Engine</div>
    </div>

    <div style="display:flex; gap:12px;">
      <button class="icon-btn" id="prevTrackBtn">⏮</button>
      <button class="icon-btn" id="nextTrackBtn">⏭</button>
    </div>

    <!-- EMBED ENGINE CONTAINER -->
    <div class="player-frame-box" id="dockPortal">
      <div style="color:var(--text-muted); font-size:0.75rem; text-align:center; padding-top:55px;">No Song Selected</div>
    </div>
  </div>

  <audio id="nativeAudioPlayer" class="hidden"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    /* 👇 APNI YOUTUBE API KEY YAHAN DAALEIN 👇 */
    const YOUTUBE_API_KEY = "PASTE_YOUR_YOUTUBE_API_KEY_HERE";

    const firebaseConfig = {
      apiKey: "AIzaSyBfZ5QsR6JQ5RTNX1NiIIVuMJ5GC1m7JgE",
      authDomain: "exmmusic.firebaseapp.com",
      projectId: "exmmusic",
      storageBucket: "exmmusic.firebasestorage.app",
      messagingSenderId: "346732395794",
      appId: "1:346732395794:web:8c6840b04ef89cd67347cb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const playerDock = document.getElementById('playerDock');
    const userBadge = document.getElementById('userBadge');
    const dockPortal = document.getElementById('dockPortal');
    const nativeAudio = document.getElementById('nativeAudioPlayer');

    let currentPlaylist = [];
    let currentIndex = -1;
    let favorites = JSON.parse(localStorage.getItem('bn_favs') || '[]');
    let offlineSongs = [];

    onAuthStateChanged(auth, (user) => {
      if (user) enterApp(user.email.split('@')[0]);
      else if (sessionStorage.getItem('bn_guest')) enterApp('Guest');
      else {
        appSection.classList.add('hidden');
        playerDock.classList.add('hidden');
        authSection.classList.remove('hidden');
      }
    });

    function enterApp(name) {
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      playerDock.classList.remove('hidden');
      userBadge.innerText = name;
      updateCounters();
    }

    document.getElementById('guestBtn').onclick = () => {
      sessionStorage.setItem('bn_guest', 'Guest');
      enterApp('Guest');
    };
    document.getElementById('logoutBtn').onclick = () => {
      sessionStorage.removeItem('bn_guest');
      signOut(auth).catch(() => {});
      location.reload();
    };

    /* GUARANTEED SOUND & NO-RESTRICTION PLAY ENGINE */
    function playTrackAtIndex(idx) {
      if (idx < 0 || idx >= currentPlaylist.length) return;
      currentIndex = idx;
      const track = currentPlaylist[currentIndex];

      document.getElementById('dockTitle').innerText = track.title;
      document.getElementById('dockSub').innerText = track.channel || "Playing Track";

      nativeAudio.pause();

      if (track.isOffline) {
        dockPortal.innerHTML = `<div style="color:var(--primary); font-size:0.8rem; text-align:center; padding-top:55px;">Playing Offline MP3</div>`;
        nativeAudio.src = track.audioUrl;
        nativeAudio.play();
      } else {
        // Direct HTTPS origin embed without player config errors
        dockPortal.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${track.id}?autoplay=1&enablejsapi=1&playsinline=1"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        `;
      }
    }

    document.getElementById('nextTrackBtn').onclick = () => {
      if (currentIndex + 1 < currentPlaylist.length) playTrackAtIndex(currentIndex + 1);
    };
    document.getElementById('prevTrackBtn').onclick = () => {
      if (currentIndex - 1 >= 0) playTrackAtIndex(currentIndex - 1);
    };

    /* SEARCH API */
    async function searchTracks() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:18px;">Searching songs...</p>';

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=25&videoDuration=medium&q=${encodeURIComponent(q + " song")}&type=video&key=${YOUTUBE_API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.error) {
          resultsDiv.innerHTML = `<p style="color:#f43f5e; padding:18px; text-align:center;">API Error: ${data.error.message}</p>`;
          return;
        }

        currentPlaylist = (data.items || []).map(item => ({
          id: item.id.videoId,
          title: item.snippet.title.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'),
          channel: item.snippet.channelTitle,
          thumb: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url,
          isOffline: false
        }));

        renderList(currentPlaylist, resultsDiv);
      } catch (err) {
        resultsDiv.innerHTML = '<p style="color:#f43f5e; padding:18px; text-align:center;">Network error.</p>';
      }
    }

    document.getElementById('searchBtn').onclick = searchTracks;
    document.getElementById('searchInput').onkeypress = (e) => { if (e.key === 'Enter') searchTracks(); };

    function renderList(list, container) {
      container.innerHTML = '';
      list.forEach((track, idx) => {
        const isFav = favorites.some(f => f.id === track.id);
        const div = document.createElement('div');
        div.className = 'song-card';
        div.innerHTML = `
          <img class="song-thumb" src="${track.thumb || 'https://via.placeholder.com/52/111827/ffffff?text=MP3'}">
          <div class="song-meta">
            <div class="song-title">${track.title}</div>
            <div class="song-sub">${track.channel}</div>
          </div>
          ${!track.isOffline ? `<button class="icon-btn fav-btn ${isFav ? 'fav-active' : ''}">❤️</button>` : ''}
        `;

        div.querySelector('.song-meta').onclick = () => {
          currentPlaylist = list;
          playTrackAtIndex(idx);
        };

        if (!track.isOffline) {
          div.querySelector('.fav-btn').onclick = (e) => {
            e.stopPropagation();
            const index = favorites.findIndex(f => f.id === track.id);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(track);
            localStorage.setItem('bn_favs', JSON.stringify(favorites));
            updateCounters();
            renderList(list, container);
          };
        }
        container.appendChild(div);
      });
    }

    document.getElementById('localFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        offlineSongs.push({
          id: 'off_' + Date.now(),
          title: file.name.replace(/\.[^/.]+$/, ""),
          channel: "Local Storage",
          audioUrl: URL.createObjectURL(file),
          isOffline: true
        });
        updateCounters();
        renderList(offlineSongs, document.getElementById('offlineResults'));
      }
    };

    function updateCounters() {
      document.getElementById('favCount').innerText = favorites.length;
      document.getElementById('offCount').innerText = offlineSongs.length;
    }

    // TABS
    const tSearch = document.getElementById('tabSearch');
    const tFav = document.getElementById('tabFavorites');
    const tOff = document.getElementById('tabOffline');

    tSearch.onclick = () => {
      tSearch.className = 'tab-item active'; tFav.className = 'tab-item'; tOff.className = 'tab-item';
      document.getElementById('searchView').classList.remove('hidden');
      document.getElementById('favoritesView').classList.add('hidden');
      document.getElementById('offlineView').classList.add('hidden');
    };
    tFav.onclick = () => {
      tFav.className = 'tab-item active'; tSearch.className = 'tab-item'; tOff.className = 'tab-item';
      document.getElementById('favoritesView').classList.remove('hidden');
      document.getElementById('searchView').classList.add('hidden');
      document.getElementById('offlineView').classList.add('hidden');
      renderList(favorites, document.getElementById('favResults'));
    };
    tOff.onclick = () => {
      tOff.className = 'tab-item active'; tSearch.className = 'tab-item'; tFav.className = 'tab-item';
      document.getElementById('offlineView').classList.remove('hidden');
      document.getElementById('searchView').classList.add('hidden');
      document.getElementById('favoritesView').classList.add('hidden');
      renderList(offlineSongs, document.getElementById('offlineResults'));
    };
  </script>
</body>
</html>
